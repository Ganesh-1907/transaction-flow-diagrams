# Transaction flow diagram. Edit this file, then run ./transaction_flow.sh
# Same format as workflow-diagram-tool: nodes + edges. See README.md for the field list.
# Additional sale = "Fee Adjustments" in the BX screen. One program_participant_transaction row (T),
# created by the teacher. Payments update that same row, a Pay click never creates a new one.

workflow:
  name: "Additional Sale (Fee Adjustments) - Course participant"

  # Named links: the name is shown in its colour in the Built URL box and on the arrows (link: <id>).
  links:
    - id: pay
      name: "Pay link"
      color: "#1565c0"
    - id: thankyou
      name: "Thank you link"
      color: "#2e7d32"
    - id: fail
      name: "Fail link"
      color: "#c62828"
    - id: retry
      name: "Retry link"
      color: "#e65100"

  nodes:
    # ---- start: teacher screen, shared by both sides
    - id: flow_start
      label: "START"
      type: marker
      subtype: start

    - id: bx_popup
      label: "Teacher opens Fee Adjustments"
      type: frontend_screen
      subtype: bx_screen
      context:
        - "fees, reason, Payment Mode"
        - "only when the participant has fully paid"

    # ================= OFFLINE side =================
    # ---- status Pending at creation
    - id: off_t_pend
      label: "INSERT T"
      type: db_row
      subtype: transaction_row
      group: "OFFLINE: teacher records the payment"
      state: PENDING
      context:
        - "program_participant_transaction"
        - "is_additional_sale = true"

    - id: off_edit
      label: "Teacher edits the payment, status Confirmed"
      type: frontend_screen
      subtype: bx_screen
      group: "OFFLINE: teacher records the payment"
      context: "money received"

    - id: off_t_ok
      label: "UPDATE T"
      type: db_row
      subtype: transaction_row
      group: "OFFLINE: teacher records the payment"
      state: CONFIRMED
      context: "PENDING -> CONFIRMED"

    - id: off_p1_ok
      label: "UPDATE P1"
      type: db_row
      subtype: participant_row
      group: "OFFLINE: teacher records the payment"
      context: "balance_due = balance_due - amount paid"

    - id: off_mail_ok2
      label: "Success email"
      type: notification
      subtype: email
      group: "OFFLINE: teacher records the payment"
      context: "only if send confirmation is ticked"

    - id: off_p1_pend
      label: "UPDATE P1"
      type: db_row
      subtype: participant_row
      group: "OFFLINE: teacher records the payment"
      context:
        - "balance_due = amount"
        - "total_amount = total_amount + amount"

    - id: off_mail_req
      label: "Request email"
      type: notification
      subtype: email
      group: "OFFLINE: teacher records the payment"
      context:
        - "to the participant, teacher CC optional"
        - "still has the Pay link"

    # ---- participant ignores "offline" and pays online with the link in the request email
    - id: off_rx_pay
      label: "Participant clicks the Pay link and pays online"
      type: frontend_screen
      subtype: rx_screen
      group: "OFFLINE: teacher records the payment"
      context:
        - "Additional sale page: Continue, Pay now"
        - "CAPS order, webhook updates the same T"

    - id: off_t_online
      label: "UPDATE T"
      type: db_row
      subtype: transaction_row
      group: "OFFLINE: teacher records the payment"
      state: CONFIRMED
      context:
        - "PENDING -> CONFIRMED"
        - "payment method changes from offline to the online one"
        - "total_amount = amount paid online"

    - id: off_p1_online
      label: "UPDATE P1"
      type: db_row
      subtype: participant_row
      group: "OFFLINE: teacher records the payment"
      context: "balance_due = balance_due - amount paid (becomes 0)"

    - id: off_mail_ok3
      label: "Success email"
      type: notification
      subtype: email
      group: "OFFLINE: teacher records the payment"
      context: "with invoice"

    - id: off_t_fail
      label: "UPDATE T"
      type: db_row
      subtype: transaction_row
      group: "OFFLINE: teacher records the payment"
      state: FAILED
      context:
        - "PENDING -> FAILED"
        - "payment method changes to the online one"
        - "teacher cannot edit it or create a new additional sale"

    - id: off_mail_fail
      label: "Failure email"
      type: notification
      subtype: email
      group: "OFFLINE: teacher records the payment"
      context:
        - "has the Retry link"
        - "participant must pay with it, the same T is updated"

    - id: off_thankyou
      label: "Thank you page"
      type: frontend_screen
      subtype: rx_screen
      group: "OFFLINE: teacher records the payment"
      context: "payment success or processing"

    - id: off_failed
      label: "Failed page"
      type: frontend_screen
      subtype: rx_screen
      group: "OFFLINE: teacher records the payment"
      context:
        - "payment failed or any other status"
        - "has a Try again button"

    - id: off_close
      label: "Participant closes the tab or clicks Back"
      type: frontend_screen
      subtype: rx_screen
      group: "OFFLINE: teacher records the payment"
      context:
        - "T stays PENDING"
        - "the link still works"
        - "payment method may already show online"

    # ---- status Confirmed at creation
    - id: off_t_conf
      label: "INSERT T"
      type: db_row
      subtype: transaction_row
      group: "OFFLINE: teacher records the payment"
      state: CONFIRMED
      context:
        - "program_participant_transaction"
        - "is_additional_sale = true"
        - "method, date, receipt saved"

    - id: off_p1_conf
      label: "UPDATE P1"
      type: db_row
      subtype: participant_row
      group: "OFFLINE: teacher records the payment"
      context:
        - "program_participant"
        - "total_amount = total_amount + amount"
        - "balance_due unchanged"

    - id: off_mail_ok1
      label: "Success email"
      type: notification
      subtype: email
      group: "OFFLINE: teacher records the payment"
      context: "with invoice"

    # ================= REVOKE (same for online and offline) =================
    - id: rev_click
      label: "Teacher clicks Revoke"
      type: frontend_screen
      subtype: bx_screen
      group: "REVOKE: same for online and offline"
      context: "only while T is PENDING"

    - id: rev_t
      label: "UPDATE T"
      type: db_row
      subtype: transaction_row
      group: "REVOKE: same for online and offline"
      state: NOT_RECEIVED
      context: "PENDING -> NOT_RECEIVED"

    - id: rev_p1
      label: "UPDATE P1"
      type: db_row
      subtype: participant_row
      group: "REVOKE: same for online and offline"
      context:
        - "total_amount = total_amount - amount"
        - "balance_due = balance_due - amount"

    - id: rev_mail
      label: "Revoke email"
      type: notification
      subtype: email
      group: "REVOKE: same for online and offline"
      context: "the link now says revoked"

    # ================= ONLINE side =================
    - id: on_t_new
      label: "INSERT T"
      type: db_row
      subtype: transaction_row
      group: "ONLINE: participant pays with the email link"
      state: PENDING
      context:
        - "program_participant_transaction"
        - "is_additional_sale = true"

    - id: on_p1_new
      label: "UPDATE P1"
      type: db_row
      subtype: participant_row
      group: "ONLINE: participant pays with the email link"
      context:
        - "program_participant"
        - "balance_due = amount"
        - "total_amount = total_amount + amount"

    - id: on_mail_request
      label: "Request email"
      type: notification
      subtype: email
      group: "ONLINE: participant pays with the email link"
      context:
        - "to the participant, teacher CC optional"
        - "has the Pay link"

    - id: on_rx_pay
      label: "Additional sale page: Continue, Pay now"
      type: frontend_screen
      subtype: rx_screen
      group: "ONLINE: participant pays with the email link"
      context:
        - "participant opens the link"
        - "CAPS order, webhook updates the same T"

    - id: on_t_ok
      label: "UPDATE T"
      type: db_row
      subtype: transaction_row
      group: "ONLINE: participant pays with the email link"
      state: CONFIRMED
      context: "PENDING -> CONFIRMED"

    - id: on_p1_ok
      label: "UPDATE P1"
      type: db_row
      subtype: participant_row
      group: "ONLINE: participant pays with the email link"
      context: "balance_due = balance_due - amount paid"

    - id: on_mail_ok
      label: "Success email"
      type: notification
      subtype: email
      group: "ONLINE: participant pays with the email link"
      context: "with invoice"

    - id: on_t_fail
      label: "UPDATE T"
      type: db_row
      subtype: transaction_row
      group: "ONLINE: participant pays with the email link"
      state: FAILED
      context:
        - "PENDING -> FAILED"
        - "teacher cannot edit it or create a new additional sale"

    - id: on_mail_fail
      label: "Failure email"
      type: notification
      subtype: email
      group: "ONLINE: participant pays with the email link"
      context:
        - "has the Retry link"
        - "participant must pay with it, the same T is updated"

    - id: on_thankyou
      label: "Thank you page"
      type: frontend_screen
      subtype: rx_screen
      group: "ONLINE: participant pays with the email link"
      context: "payment success or processing"

    - id: on_failed
      label: "Failed page"
      type: frontend_screen
      subtype: rx_screen
      group: "ONLINE: participant pays with the email link"
      context:
        - "payment failed or any other status"
        - "has a Try again button"

    - id: on_close
      label: "Participant closes the tab or clicks Back"
      type: frontend_screen
      subtype: rx_screen
      group: "ONLINE: participant pays with the email link"
      context:
        - "T stays PENDING"
        - "the link still works"

  edges:
    - from: flow_start
      to: bx_popup
    # ---- online side
    - from: bx_popup
      to: on_t_new
      condition: "Payment Mode: Online"
    - from: on_t_new
      to: on_p1_new
    - from: on_p1_new
      to: on_mail_request
    - from: on_mail_request
      to: on_rx_pay
      link: pay
      condition: "participant clicks it"
    - from: on_rx_pay
      to: on_t_ok
      condition: "payment succeeds"
    - from: on_t_ok
      to: on_p1_ok
    - from: on_t_ok
      to: on_mail_ok
    - from: on_t_ok
      to: on_thankyou
      link: thankyou
    - from: on_rx_pay
      to: on_t_fail
      condition: "payment declined"
    - from: on_t_fail
      to: on_mail_fail
    - from: on_t_fail
      to: on_failed
      link: fail
    - from: on_failed
      to: on_rx_pay
      link: retry
      condition: "Try again button"
      style: dashed
    - from: on_mail_fail
      to: on_rx_pay
      link: retry
      condition: "opens the payment step again"
      style: dashed
    - from: on_rx_pay
      to: on_close
      style: dashed
    # ---- offline side
    - from: bx_popup
      to: off_t_pend
      condition: "Payment Mode: Offline, status Pending"
    - from: bx_popup
      to: off_t_conf
      condition: "Payment Mode: Offline, status Confirmed"
    - from: off_t_conf
      to: off_p1_conf
    - from: off_t_conf
      to: off_mail_ok1
    - from: off_t_pend
      to: off_edit
      condition: "payment received"
      style: dashed
    - from: off_t_pend
      to: off_p1_pend
    - from: off_p1_pend
      to: off_mail_req
    - from: off_mail_req
      to: off_rx_pay
      link: pay
      condition: "participant clicks it"
      style: dashed
    - from: off_rx_pay
      to: off_t_online
      condition: "payment succeeds"
    - from: off_t_online
      to: off_p1_online
    - from: off_t_online
      to: off_mail_ok3
    - from: off_t_online
      to: off_thankyou
      link: thankyou
    - from: off_rx_pay
      to: off_t_fail
      condition: "payment declined"
    - from: off_t_fail
      to: off_mail_fail
    - from: off_t_fail
      to: off_failed
      link: fail
    - from: off_failed
      to: off_rx_pay
      link: retry
      condition: "Try again button"
      style: dashed
    - from: off_mail_fail
      to: off_rx_pay
      link: retry
      condition: "opens the payment step again"
      style: dashed
    - from: off_rx_pay
      to: off_close
      style: dashed
    - from: off_edit
      to: off_t_ok
    - from: off_t_ok
      to: off_p1_ok
    - from: off_t_ok
      to: off_mail_ok2
    # ---- revoke, shared by both sides
    - from: on_t_new
      to: rev_click
      condition: "while PENDING"
      style: dashed
    - from: off_t_pend
      to: rev_click
      condition: "while PENDING"
      style: dashed
    - from: rev_click
      to: rev_t
    - from: rev_t
      to: rev_p1
    - from: rev_t
      to: rev_mail

  steps:
    - step: "Teacher submits, Online"
      table: "program_participant_transaction, program_participant"
      change: "INSERT T (PENDING); UPDATE P1: balance_due = amount, total_amount = total_amount + amount"
    - step: "Participant pays"
      table: "program_participant_transaction, program_participant"
      change: "UPDATE T to CONFIRMED; UPDATE P1: balance_due = balance_due - amount paid. A declined payment sets T to FAILED, the retry updates the same T"
    - step: "Teacher submits, Offline, Confirmed"
      table: "program_participant_transaction, program_participant"
      change: "INSERT T (CONFIRMED); UPDATE P1: total_amount = total_amount + amount, balance_due unchanged"
    - step: "Teacher submits, Offline, Pending"
      table: "program_participant_transaction, program_participant"
      change: "INSERT T (PENDING); UPDATE P1: balance_due = amount, total_amount = total_amount + amount"
    - step: "Offline Pending, participant pays online with the link"
      table: "program_participant_transaction, program_participant"
      change: "UPDATE T to CONFIRMED: payment method becomes the online one, T total_amount = amount paid online; UPDATE P1: balance_due = balance_due - amount paid (becomes 0)"
    - step: "Offline Pending, online payment declined"
      table: "program_participant_transaction"
      change: "UPDATE T to FAILED: payment method becomes the online one. The retry updates the same T"
    - step: "Teacher edits the payment to Confirmed"
      table: "program_participant_transaction, program_participant"
      change: "UPDATE T to CONFIRMED; UPDATE P1: balance_due = balance_due - amount paid"
    - step: "Teacher revokes, online or offline (PENDING only)"
      table: "program_participant_transaction, program_participant"
      change: "UPDATE T to NOT_RECEIVED; UPDATE P1: total_amount = total_amount - amount, balance_due = balance_due - amount"

  points:
    - "An additional sale is one row in program_participant_transaction (is_additional_sale = true), created by the teacher."
    - "Payments update that same row. A Pay click never creates a new one."
    - "Online: the participant pays with the link in the email. Offline: the teacher records the payment in BX."
    - "The participant always gets the request email. Only the teacher CC is optional."
    - "No reminder and no expiry: an unpaid T stays PENDING and balance_due stays raised until it is paid or revoked."
    - "Revoke is the same for online and offline, and works only while T is PENDING."
    - "Offline Pending still emails a pay link. If the participant pays online with it, T switches to the online payment method, and the teacher can no longer edit or revoke it."
    - "If the payment fails, T becomes FAILED. The teacher cannot edit it or create a new additional sale."
    - "The participant has to pay again with the link in the failure email, and the same T is updated."

  boxes:
    - title: "Built URL"
      lines:
        - link: pay
          text: "Built by BX when the sale is created, sent in the request email:"
          code: "<program registration_url>/additional-sale?ref=<registration_id>+<T id>"
        - "The + is a space. rx splits ref into the registration id and the T id (separate trxn_id or trxnId parameters also work)."
        - link: thankyou
          text: "After the gateway, success or processing goes to:"
          code: "<rx origin>/<locale>/programs/<program_id>/thankyou?ref=<registration_id>&caps_transaction_id=<CAPS id>"
        - link: fail
          text: "Failed, or any other status, goes to:"
          code: "<rx origin>/<locale>/programs/<program_id>/failed?ref=<registration_id>%20<T id>&caps_transaction_id=<CAPS id>"
        - "The Try again button on the failed page opens the retry-payment page with the same ref (registration id and T id)."
        - link: retry
          text: "Sent in the failure email:"
          code: "<participant retry_payment_url>/retry-payment?ref=<registration_id>%20<T id>&caps_transaction_id=<CAPS id>"
        - "The link never changes and revoke does not disable it. Each time it opens, rx asks BX for the row with this T id and picks the screen from its status:"
        - "CONFIRMED: Actions Already Completed. NOT_RECEIVED (revoked): the revoked message with the revoke date. PENDING or FAILED: the payment page."
